services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://backendcircuit-production.up.railway.app/api
    depends_on:
      - backend
    networks:
      - circuit-bazaar

  shop:
    build:
      context: ./shop
      dockerfile: Dockerfile
    ports:
      - "3003:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://backendcircuit-production.up.railway.app/api
    depends_on:
      - backend
    networks:
      - circuit-bazaar

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - VITE_API_URL=https://backendcircuit-production.up.railway.app/api
    networks:
      - circuit-bazaar

  vendor:
    build:
      context: ./vendor
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      - VITE_API_URL=https://backendcircuit-production.up.railway.app/api
    networks:
      - circuit-bazaar

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/storage
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=sqlite
      - DB_PATH=database/database.sqlite
      - MAIL_FROM_ADDRESS=noreply@circuitbazaar.com
      - MAIL_FROM_NAME="Circuit Bazaar"
    command: sh -c "php artisan serve --host=0.0.0.0 --port=8000"
    networks:
      - circuit-bazaar

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - shop
      - admin
      - vendor
      - backend
    networks:
      - circuit-bazaar

volumes:

networks:
  circuit-bazaar:
    driver: bridge