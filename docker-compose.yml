services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api.localhost
    depends_on:
      - backend
    networks:
      - circuit-bazaar

  shop:
    build:
      context: ./shop
      dockerfile: Dockerfile
    ports:
      - "3003:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api.localhost
    depends_on:
      - backend
    networks:
      - circuit-bazaar

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - VITE_API_URL=http://api.localhost
    networks:
      - circuit-bazaar

  vendor:
    build:
      context: ./vendor
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      - VITE_API_URL=http://api.localhost
    networks:
      - circuit-bazaar

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - circuit-bazaar

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/storage
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=sqlite
      - DB_PATH=database/database.sqlite
      - BROADCAST_CONNECTION=reverb
      - REDIS_HOST=redis
      - REVERB_SCALING_ENABLED=false
      - REVERB_HOST=backend
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
      - REVERB_SERVER_HOST=0.0.0.0
      - REVERB_SERVER_PORT=8080
      - REVERB_APP_ID=circuit-bazaar
      - REVERB_APP_KEY=local-reverb-key
      - REVERB_APP_SECRET=local-reverb-secret
      - MAIL_FROM_ADDRESS=noreply@circuitbazaar.com
      - MAIL_FROM_NAME="Circuit Bazaar"
    depends_on:
      - redis
    command: sh -c "php artisan serve --host=0.0.0.0 --port=8000"
    networks:
      - circuit-bazaar

  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./backend/storage:/app/storage
    environment:
      - APP_ENV=local
      - REDIS_HOST=redis
      - REVERB_SCALING_ENABLED=false
      - REVERB_SERVER_HOST=0.0.0.0
      - REVERB_SERVER_PORT=8080
      - REVERB_APP_ID=circuit-bazaar
      - REVERB_APP_KEY=local-reverb-key
      - REVERB_APP_SECRET=local-reverb-secret
    depends_on:
      - redis
      - backend
    command: sh -c "php artisan reverb:start --host=0.0.0.0 --port=8080"
    networks:
      - circuit-bazaar

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - shop
      - admin
      - vendor
      - backend
      - reverb
    networks:
      - circuit-bazaar

volumes:

networks:
  circuit-bazaar:
    driver: bridge